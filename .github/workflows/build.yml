name: Build
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-26.04
    strategy:
      matrix:
        sdk: [jc304_kit, jc305u4_kit]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - name: Install packages
        run: |
          sudo apt install -y git gradle openjdk-11-jdk gcc libpcsclite-dev libpython3-dev
      - name: Build FIDO2Applet
        run: |
          export JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64/
          export PATH=$JAVA_HOME/bin:$PATH
          export JC_HOME=sdks/${{ matrix.sdk }}
          ./gradlew buildJavaCard
